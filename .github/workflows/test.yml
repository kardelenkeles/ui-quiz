name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Verify web release build
        run: >-
          flutter build web --release --no-wasm-dry-run
          --dart-define=APP_ENV=staging
          --dart-define=API_BASE_URL=https://api-7eiuli4vcq-uc.a.run.app
          --dart-define=AUTH_CONTINUE_URL=https://quiz-ai-242b4.firebaseapp.com/finishSignIn

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --check index.js
